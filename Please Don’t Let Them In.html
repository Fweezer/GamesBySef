 else if(S.p&&S.p.knocked&&!S.busy&&S.state==='play'){if(!near())s='<span class="mut">Someone is knocking. Go to the door.</span>';else if(!S.peep)s='<button data-a="peep"><b>SPACE</b> Look through the peephole</button>';
  else if(S.p.kind){const k=S.p.kind;s='<button data-a="q">'+(k==='ent'?'Yes, there are people inside':'Let him in')+' <b>(1)</b></button><button data-a="c">'+(k==='ent'?'No, nobody is here':'Refuse')+' <b>(2)</b></button>'}
  else{const p=S.p,sp=S.tk||p.pend||p.chk,q=p.qs.find(k=>!p.asked[k]),c=p.cs.find(k=>!p.asked[k]);s='<button data-a="q" '+(q&&!sp?'':'disabled')+'>Ask: '+(q?Q[q].q:'nothing left')+' <b>(1)</b></button><button data-a="c" '+(c&&!sp?'':'disabled')+'>Ask to check: '+(c?({teeth:'their teeth',hands:'their hands',turn:'turning around'})[c]:'nothing left')+' <b>(2)</b></button><button data-a="t" '+(sp?'disabled':'')+'>Type your own question <b>(T)</b></button>';a='<button data-a="open">Open the door <b>(O)</b></button><button data-a="away">Send them away <b>(G)</b></button>'}}
 $('hud').innerHTML=s;$('act').innerHTML=a}
// ---------- input
function lock(){try{const r=cv.requestPointerLock&&cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
const locked=()=>document.pointerLockElement===cv;
cv.addEventListener('click',()=>{if(!locked())lock()});
addEventListener('mousemove',e=>{if(!locked())return;yaw-=e.movementX*.0022;pitch=clamp(pitch-e.movementY*.0022,-1.4,1.4)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(document.activeElement===$('ti')){if(k==='enter'){const v=$('ti').value.trim();$('ti').value='';closeTyp();if(v&&S.p&&!S.busy&&!S.p.kind)ask(S.p,v)}else if(k==='escape')closeTyp();return}keys[k]=1;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(k===' ')e.preventDefault();
 if(k==='m')return toggleVoice();
 if(k==='t'&&S.state==='play'){e.preventDefault();return openTyp()}
 if(k==='k'&&S.state==='menu'&&$('menu').classList.contains('on'))return newGame();
 if(k===' '||k==='enter'){const b=document.querySelector('#menu.on button');if(b){b.click();return}if(S.state==='play'){if(S.peep)peep(false);else if(S.p&&S.p.knocked&&!S.busy&&near())peep(true)}return}
 if(S.peep&&k==='s')return peep(false);
 const m={'1':'q','2':'c',o:'open',g:'away'};if(m[k])act(m[k])});
$('menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='begin')intro(0);else if(a==='in')intro(S.ip+1);else if(a==='again'||a==='skip')newGame();else if(a==='next')startNight()});
$('hud').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});$('mute').addEventListener('click',toggleVoice);$('act').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.a)});
// ---------- main loop
const v3=new THREE.Vector3();
function place(el,x,y,z){if(!el.dataset.on)return el.style.display='none';v3.set(x,y,z).project(cam);const vis=v3.z<1&&Math.abs(v3.x)<1.2&&Math.abs(v3.y)<1.2;el.style.display=vis?'block':'none';if(vis){el.style.left=clamp((v3.x*.5+.5)*innerWidth,8,innerWidth-250)+'px';el.style.top=Math.max(8,(-v3.y*.5+.5)*innerHeight-10)+'px'}}
function puff(g){const m=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xcfd8e0,transparent:true,opacity:.5}));m.position.set(g.position.x,g.position.y+1.58,g.position.z+.25);m.scale.setScalar(.6);scene.add(m);puffs.push(m)}
function frame(ms){requestAnimationFrame(frame);const t=ms/1000,dt=Math.min(t-t0,.05);t0=t;const pk=S.peep,K=AN&&AN.type==='kill';
 const mv=(S.state==='play'||S.state==='radio')&&!pk&&!K&&!S.tw,f=mv?(keys.w?1:0)-(keys.s?1:0):0,r=mv?(keys.d?1:0)-(keys.a?1:0):0;
 yaw+=((keys.arrowleft?1:0)-(keys.arrowright?1:0))*dt*1.8;pitch=clamp(pitch+((keys.arrowup?1:0)-(keys.arrowdown?1:0))*dt*1.5,-1.4,1.4);
 if(mv){const nx=clamp(cam.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*r)*2.4*dt,-5.6,5.6),nz=clamp(cam.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*r)*2.4*dt,.3,12.6);if(!hit(nx,cam.position.z))cam.position.x=nx;if(!hit(cam.position.x,nz))cam.position.z=nz;cam.position.y=1.6+((f||r)?Math.sin(t*9)*.025:0)}
 if(S.tw){const w=S.tw;w.t=Math.min(1,w.t+dt*3.2);const k=ease(w.t);cam.position.lerpVectors(w.from,w.to,k);cam.fov=w.f0+(w.f1-w.f0)*k;cam.updateProjectionMatrix();if(w.t>=1){S.tw=null;if(!S.peep)door.visible=true}}
 if(pk){yaw=clamp(yaw,-.45,.45);pitch=clamp(pitch,-.7,.15)}
 if(P&&!AN){const g=P.g,c=P.chk;g.position.z+=(P.tz-g.position.z)*Math.min(1,dt*1.4);if(!P.knocked&&Math.abs(g.position.z-P.tz)<.35){P.knocked=1;P.kind==='ent'?entKnock():knock()}g.position.y=g.position.z>-4.9?.2:g.position.z>-5.4?.1:0;const st=P.v&&P.sg.includes('still');g.rotation.z=st?0:Math.sin(t*1.3)*.03;g.position.x=st?0:Math.sin(t*.7)*.04;
  if(!(P.v&&P.sg.includes('blink'))){if(t>P.nextBlink){P.blinkEnd=t+.14;P.nextBlink=t+(P.nerv?.7:3.4)+Math.random()*1.5}P.eyes.forEach(e=>e.scale.y=(t<P.blinkEnd?.1:1)*(P.v&&P.sg.includes('eyes')?1.7:1))}
  P.breathT+=dt;if(P.breathT>1.8&&Math.abs(g.position.z-P.tz)<.3&&!(P.v&&P.sg.includes('breath'))){P.breathT=0;puff(g)}
  if(c){c.t+=dt;if(c.a==='teeth'){P.mouth.scale.y=c.t<3?1+4*ease(c.t*4):1;P.tg.visible=c.t>.2&&c.t<3}else if(c.a==='hands'){const o=c.t<3?ease(c.t*2.5):1-ease((c.t-3)*2.5);P.arms.forEach(a=>a.rotation.x=-1.4*o)}if(c.a==='turn')g.rotation.y=ease(c.t/3)*Math.PI*2;if(c.t>3.5){g.rotation.y=0;P.mouth.scale.y=1;P.tg.visible=false;P.arms.forEach(a=>a.rotation.x=0);P.chk=null}}}
 stepGuests(dt,t);stepAnim(dt);
 const fk=P&&(P.kind==='ent'||(P.v&&P.sg.includes('flicker')))&&S.p===P&&!AN;
 lamp.intensity=K?(AN.t>2.4?0:(Math.random()<.25?.15:1.8)):fk?(Math.random()<.5?.05:1.8):1.8*(Math.random()<.01?.3:1);L1.intensity=fk&&Math.random()<.5?.1:(Math.random()<.004?.2:.9);fire.intensity=1.1+Math.random()*.5;flames.forEach((c,i)=>{c.scale.y=.85+Math.sin(t*9+i*2)*.2+Math.random()*.1;c.scale.x=c.scale.z=.9+Math.sin(t*7+i)*.1});
 puffs=puffs.filter(m=>{m.position.y+=dt*.25;m.position.z+=dt*.25;m.scale.multiplyScalar(1+dt*1.6);m.material.opacity-=dt*.28;if(m.material.opacity<=0){scene.remove(m);return false}return true});
 if(pk&&P)place($('bub'),P.g.position.x+.4,P.g.position.y+1.95,P.g.position.z);else $('bub').style.display='none';place($('rb'),-2.6,1.45,1.5);
 const hk=[S.state,!!S.p,!!(S.p&&S.p.knocked),S.busy,near(),!!pk,S.tk?1:0,S.p&&(S.p.pend||S.p.chk)?1:0,S.p?Object.keys(S.p.asked).join():''].join();if(hk!==S.hk){S.hk=hk;renderHud()}
 const sk=S.shake||0;if(sk>0)S.shake=Math.max(0,sk-dt*.25);cam.rotation.set(pitch+(Math.random()-.5)*sk*2,yaw+(Math.random()-.5)*sk*2,0);R.render(scene,cam)}
(async()=>{try{if(window.claude&&claude.use){SMP=await claude.use('sample');ROOM=await claude.use('room');if(ROOM){ROOM.onPeers(c=>{const b=$('board');b.textContent='';c.peers.filter(p=>!p.isMe&&p.presence&&p.presence.n).forEach(p=>{const d=document.createElement('div');d.textContent=String(p.presence.n).slice(0,20)+' · night '+((+p.presence.night||0)+1)+' · '+(p.presence.dead?'dead':'alive');b.appendChild(d)});});pres()}}}catch(e){}})();
function pres(){try{if(ROOM)ROOM.presence({n:ME,night:S.night||0,dead:S.state==='dead'})}catch(e){}}
showScr('<h1>Please Don’t Let Them In</h1><p class="mut">WASD walk · mouse look · SPACE peephole</p><button class="pri" data-a="begin">Begin <b>(Space)</b></button>');
