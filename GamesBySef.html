
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamesBySef</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d13;color:#f3f6fb;font:16px Arial,sans-serif}
header{padding:22px 5%;background:#101722;border-bottom:1px solid #293646}
h1{margin:0;font-size:30px}
main{max-width:1100px;margin:35px auto;padding:0 20px}
input{width:100%;padding:14px;background:#151e29;border:1px solid #334253;border-radius:9px;color:white;margin-bottom:25px;font-size:16px}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:#121b26;border:1px solid #273444;border-radius:10px;padding:14px}
.thumb{height:125px;background:#0a111b;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:bold;color:#52677f;overflow:hidden;margin-bottom:12px}
.thumb img{width:100%;height:100%;object-fit:cover}
a{color:white;text-decoration:none;font-weight:bold;overflow-wrap:anywhere}
#empty{color:#9aa8ba;text-align:center;padding:25px}
@media(max-width:500px){h1{font-size:24px}main{padding:0 12px}#games{grid-template-columns:repeat(2,minmax(0,1fr))}.thumb{height:95px}}
</style>
</head>
<body>
<header><h1>GamesBySef</h1></header>
<main>
<input id="search" placeholder="Search games..." aria-label="Search games">
<div id="games"></div>
<div id="empty">Your games will appear here.</div>
</main>
<script>
const games = [];
const list = document.getElementById('games');
const search = document.getElementById('search');

function render(){
  list.replaceChildren();
  const filtered = games.filter(g =>
    g.name.toLowerCase().includes(search.value.trim().toLowerCase())
  );

  filtered.forEach(g => {
    const card = document.createElement('article');
    card.className = 'card';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';

    if(g.image){
      const img = document.createElement('img');
      img.src = g.image;
      img.alt = '';
      thumb.append(img);
    } else {
      thumb.textContent = g.name.slice(0,2).toUpperCase();
    }

    const link = document.createElement('a');
    link.textContent = g.name;
    link.href = g.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';

    card.append(thumb,link);
    list.append(card);
  });

  document.getElementById('empty').hidden = filtered.length > 0;
}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
